{% extends "base.html" %} {% block title %}Admin Panel{% endblock %} {% block
content %}
<section class="section">
  <h1 class="page-title">📤 Admin Panel</h1>

  <div class="admin-actions">
    <a href="{{ url_for('settings') }}" class="btn btn-outline"
      >⚙️ Personal Settings</a
    >
  </div>

  <div class="admin-box">
    <h2>Upload New Song</h2>
    <form
      method="POST"
      action="{{ url_for('upload') }}"
      enctype="multipart/form-data"
      class="upload-form"
    >
      <input type="file" name="song" accept=".mp3,.wav,.ogg,.m4a" required />
      <input type="file" name="cover" accept=".png,.jpg,.jpeg,.gif" />
      <button type="submit" class="btn btn-primary">Upload</button>
    </form>
  </div>

  <div class="admin-box">
    <h2>Uploaded Songs</h2>
    {% if songs %} {% for song in songs %}
    <div class="manage-item">
      <span>🎧 {{ song.title }}</span>
      <form
        method="POST"
        action="{{ url_for('delete', filename=song.file) }}"
        onsubmit="return confirm('Are you sure you want to delete this song?');"
      >
        <button type="submit" class="btn btn-danger">Delete</button>
      </form>
    </div>
    {% endfor %} {% else %}
    <p class="empty">No songs uploaded yet.</p>
    {% endif %}
  </div>
</section>
{% endblock %}
